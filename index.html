<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wordle</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c10;--ink:#f1ede4;--mut:#8f8c84;--tile:rgba(255,255,255,.035);--tb:rgba(241,237,228,.17);--fill:rgba(241,237,228,.5);--abs:#2b2d35;--key:rgba(255,255,255,.08);--keyh:rgba(255,255,255,.15);--gold:#d9b765;--gold2:#a8802f;--panel:rgba(16,17,22,.88);--glow:rgba(217,183,101,.13);--ok1:#2eab7d;--ok2:#146d52;--pr1:#e4c373;--pr2:#b0852b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-theme="light"]){color-scheme:light}}
:root[data-theme="light"]{--bg:#f5f5f2;--ink:#17181d;--mut:#6f6e69;--tile:rgba(255,255,255,.55);--tb:rgba(23,24,29,.17);--fill:rgba(23,24,29,.55);--abs:#8c8f98;--key:rgba(23,24,29,.07);--keyh:rgba(23,24,29,.13);--gold:#9b7420;--gold2:#6f5013;--panel:rgba(250,250,247,.92);--glow:rgba(155,116,32,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;overflow:hidden;transition:background .5s,color .5s}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 480px at 50% -8%,var(--glow),transparent 70%),radial-gradient(ellipse at 50% 120%,var(--glow),transparent 60%);pointer-events:none}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.app{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;max-width:560px;margin:0 auto;padding:10px 14px 14px}
header{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 0 10px}
header .l,header .r{display:flex;gap:6px}header .r{justify-content:flex-end}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--tb);background:var(--tile);color:var(--ink);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px);transition:border-color .25s,transform .25s}
.ib:hover{border-color:var(--gold)}.ib:active{transform:scale(.92)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ti{text-align:center}
h1{margin:0;font:600 clamp(2.1rem,8vw,2.9rem)/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.06em;background:linear-gradient(100deg,var(--gold2),var(--gold) 45%,var(--ink) 60%,var(--gold) 80%);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:220% 100%;animation:sheen 7s ease-in-out 1s 1 both}
@keyframes sheen{from{background-position:100% 0}to{background-position:0 0}}
.sub{font-size:.72rem;color:var(--mut);letter-spacing:.14em;margin-top:5px}
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;min-height:0;gap:14px}
#board{display:grid;gap:7px;--t:min(64px,13.2vw,calc((100dvh - 360px)/6))}
.row{display:grid;grid-template-columns:repeat(5,var(--t));gap:7px}
.row.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.tile{height:var(--t);border:1px solid var(--tb);background:var(--tile);border-radius:4px;display:grid;place-items:center;font:700 calc(var(--t)*.52)/1 "Cormorant Garamond",Georgia,serif;text-transform:uppercase;backdrop-filter:blur(6px);transition:border-color .15s}
.tile.on{border-color:var(--fill);animation:pop .12s}
@keyframes pop{50%{transform:scale(1.08)}}
.tile.flip{animation:flip .56s ease-in-out both}
@keyframes flip{50%{transform:rotateX(90deg)}}
.tile.ok,.tile.pr,.tile.ab{color:#fff;border-color:transparent;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.tile.ok{background:linear-gradient(150deg,var(--ok1),var(--ok2));box-shadow:0 0 18px rgba(46,171,125,.28)}
.tile.pr{background:linear-gradient(150deg,var(--pr1),var(--pr2));box-shadow:0 0 18px rgba(217,183,101,.25)}
.tile.ab{background:var(--abs)}
.tile.win{animation:bounce .7s ease both}
@keyframes bounce{30%{transform:translateY(-14px)}55%{transform:translateY(3px)}75%{transform:translateY(-5px)}}
#kb{display:flex;flex-direction:column;gap:7px;width:100%;max-width:500px}
.kr{display:flex;gap:5px;justify-content:center}
.k{flex:1;max-width:44px;height:clamp(44px,7.4dvh,58px);border:0;border-radius:6px;background:var(--key);color:var(--ink);font:500 .95rem Jost,sans-serif;cursor:pointer;text-transform:uppercase;transition:background .2s,transform .1s;padding:0}
.k.w{flex:1.6;max-width:68px;font-size:.7rem;letter-spacing:.06em}
.k:hover{background:var(--keyh)}.k:active{transform:scale(.93)}
.k.ok{background:linear-gradient(150deg,var(--ok1),var(--ok2));color:#fff}
.k.pr{background:linear-gradient(150deg,var(--pr1),var(--pr2));color:#fff}
.k.ab{background:var(--abs);opacity:.55;color:#fff}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#toasts{position:fixed;top:calc(78px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:30;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;font-size:.9rem;animation:tin .25s both;transition:opacity .4s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#ov{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);padding:18px}
#ov.show{display:grid;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.card{position:relative;width:100%;max-width:420px;max-height:88dvh;overflow:auto;background:var(--panel);border:1px solid var(--tb);border-radius:14px;padding:28px 26px 24px;backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.card::before{content:"";position:absolute;left:26px;right:26px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.card h2{margin:0 0 14px;font:600 1.9rem/1.1 "Cormorant Garamond",Georgia,serif;text-align:center}
.card p{font-size:.92rem;line-height:1.55;color:var(--mut);margin:0 0 10px}
.card p b{color:var(--ink);font-weight:500}
.x{position:absolute;right:12px;top:12px;width:34px;height:34px}
.ex{display:flex;gap:5px;margin:4px 0 8px}.ex .tile{--t:40px;width:40px;font-size:1.3rem}
.st{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin:6px 0 18px}
.st b{display:block;font:600 2rem "Cormorant Garamond",Georgia,serif;color:var(--ink)}.st span{font-size:.68rem;color:var(--mut)}
.bar{display:flex;align-items:center;gap:8px;font-size:.8rem;margin:4px 0;color:var(--mut)}
.bar i{display:block;min-width:22px;padding:2px 7px;text-align:right;font-style:normal;color:#fff;background:var(--abs);border-radius:3px;font-size:.75rem}
.bar i.me{background:linear-gradient(90deg,var(--ok2),var(--ok1))}
.btns{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:13px;border-radius:999px;border:1px solid var(--tb);background:transparent;color:var(--ink);font:500 .9rem Jost,sans-serif;cursor:pointer;transition:.25s}
.btn.pri{background:linear-gradient(120deg,var(--gold2),var(--gold));color:#fff;border-color:transparent}
.btn:hover{transform:translateY(-1px);border-color:var(--gold)}
.ans{text-align:center;font:600 1.5rem "Cormorant Garamond",Georgia,serif;letter-spacing:.2em;text-transform:uppercase;margin:0 0 14px;color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <header>
    <div class="l"><button class="ib" id="help" aria-label="How to play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg></button></div>
    <div class="ti" data-avoid><h1>Wordle</h1><div class="sub" id="sub"></div></div>
    <div class="r">
      <button class="ib" id="stats" aria-label="Statistics"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg></button>
      <button class="ib" id="theme" aria-label="Toggle light or dark theme"></button>
    </div>
  </header>
  <main>
    <div id="board" data-avoid aria-label="Game board"></div>
    <div id="kb" data-avoid></div>
  </main>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="ov"><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

<script>
const $=s=>document.querySelector(s), store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let answer, rows=[], cur="", over=false, busy=true;const cache={};
let token="",results=[];
async function call(path,body){const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});if(!r.ok)throw 0;return r.json()}
const board=$("#board"), kb=$("#kb"), keys={}, order={ab:1,pr:2,ok:3};

/* ---------- theme ---------- */
const root=document.documentElement;
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
function setTheme(t,save){root.dataset.theme=t;$("#theme").innerHTML=t=="dark"?SUN:MOON;if(save)store.set("wl-theme",t)}
setTheme(store.get("wl-theme",matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));
$("#theme").onclick=()=>setTheme(root.dataset.theme=="dark"?"light":"dark",true);

/* ---------- board ---------- */
for(let r=0;r<6;r++){const row=document.createElement("div");row.className="row";for(let c=0;c<5;c++)row.append(Object.assign(document.createElement("div"),{className:"tile"}));board.append(row)}
["qwertyuiop","asdfghjkl","*zxcvbnm<"].forEach(s=>{const r=document.createElement("div");r.className="kr";[...s].forEach(ch=>{const b=document.createElement("button");b.className="k";b.type="button";if(ch=="*"){b.textContent="Enter";b.dataset.k="Enter";b.classList.add("w")}else if(ch=="<"){b.textContent="Del";b.dataset.k="Backspace";b.classList.add("w");b.setAttribute("aria-label","Delete")}else{b.textContent=ch;b.dataset.k=ch;keys[ch]=b}r.append(b)});kb.append(r)});
kb.onclick=e=>{const b=e.target.closest(".k");if(b){b.blur();press(b.dataset.k)}};
addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey||e.altKey||$("#ov").classList.contains("show"))return;const k=e.key;if(k=="Enter"||k=="Backspace"||/^[a-z]$/i.test(k)){if(k=="Enter")e.preventDefault();press(k.length==1?k.toLowerCase():k)}});
const tiles=r=>board.children[r].children;
function toast(m,ms=1500){const t=document.createElement("div");t.className="toast";t.textContent=m;$("#toasts").prepend(t);setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),400)},ms)}
function press(k){
  if(over||busy)return;
  if(k=="Enter")return submit();
  if(k=="Backspace"){if(cur){cur=cur.slice(0,-1);const t=tiles(rows.length)[cur.length];t.textContent="";t.classList.remove("on")}return}
  if(cur.length<5){const t=tiles(rows.length)[cur.length];t.textContent=k;t.classList.add("on");cur+=k}
}
async function submit(){
  const row=board.children[rows.length];
  const bad=m=>{toast(m);row.classList.remove("shake");void row.offsetWidth;row.classList.add("shake")};
  if(cur.length<5)return bad("Not enough letters");
  busy=true;let d;
  try{d=await call("/api/guess",{token,guess:cur})}catch(e){busy=false;return toast("Connection problem, try again")}
  busy=false;
  if(!d.valid)return bad("Not in dictionary");
  token=d.token;if(d.answer)answer=d.answer;
  const g=cur;cur="";rows.push(g);results.push(d.res);reveal(rows.length-1,g,true,d.res,d.won);
}
function paintKeys(g,res){res.forEach((s,i)=>{const k=keys[g[i]];const had=["ab","pr","ok"].find(c=>k.classList.contains(c));if(!had||order[s]>order[had]){k.classList.remove("ab","pr","ok");k.classList.add(s)}})}
function reveal(r,g,anim,res,won){
  const ts=tiles(r);
  [...g].forEach((ch,i)=>{const t=ts[i];t.textContent=ch;t.classList.add("on");
    if(!anim){t.classList.add(res[i]);return}
    busy=true;t.style.animationDelay=i*.28+"s";t.classList.add("flip");
    setTimeout(()=>t.classList.add(res[i]),i*280+280)});
  const done=()=>{paintKeys(g,res);busy=false;if(anim)finish(g,r,won)};
  if(anim)setTimeout(done,5*280+300);else{paintKeys(g,res);}
}
function finish(g,r,won){
  if(won||rows.length==6){
    over=true;
    record(won,r+1);
    if(won){toast(["Magnificent","Splendid","Impressive","Excellent","Well played","Phew"][r],2000);[...tiles(r)].forEach((t,i)=>{t.style.animationDelay=i*.1+"s";t.classList.remove("flip");t.classList.add("win")})}
    setTimeout(()=>modal("end",won),won?2000:900);
  }
}

/* ---------- stats & modals ---------- */
function record(won,n){const s=store.get("wl-stats",{p:0,w:0,st:0,mx:0,d:[0,0,0,0,0,0]});s.p++;if(won){s.w++;s.d[n-1]++;s.st++;s.mx=Math.max(s.mx,s.st)}else s.st=0;store.set("wl-stats",s)}
const ov=$("#ov"),card=$("#card");
function modal(type,won){
  let h='<button class="ib x" aria-label="Close">'+'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  if(type=="help"){
    h+=`<h2>How to play</h2><p>Find the hidden five-letter word in six tries. Each guess must be a real word.</p>
    <div class="ex">${["w","e","a","r","y"].map((c,i)=>`<div class="tile ${i==0?"ok":"ab"}">${c}</div>`).join("")}</div><p><b>W</b> is in the word and in the right spot.</p>
    <div class="ex">${["p","i","l","l","s"].map((c,i)=>`<div class="tile ${i==1?"pr":"ab"}">${c}</div>`).join("")}</div><p><b>I</b> is in the word but in the wrong spot.</p>
    <div class="ex">${["v","a","g","u","e"].map((c,i)=>`<div class="tile ab">${c}</div>`).join("")}</div><p><b>U</b> is not in the word at all.</p><p>Every game starts with a fresh random word.</p>`;
  }else{
    const s=store.get("wl-stats",{p:0,w:0,st:0,mx:0,d:[0,0,0,0,0,0]}),mx=Math.max(1,...s.d),last=won?rows.length:0;
    if(type=="end")h+=won?`<h2>You solved it</h2>`:`<h2>Next time</h2><div class="ans">${answer}</div>`;else h+=`<h2>Statistics</h2>`;
    h+=`<div class="st"><div><b>${s.p}</b><span>Played</span></div><div><b>${s.p?Math.round(s.w/s.p*100):0}</b><span>Win %</span></div><div><b>${s.st}</b><span>Streak</span></div><div><b>${s.mx}</b><span>Best</span></div></div>`;
    h+=s.d.map((v,i)=>`<div class="bar"><span>${i+1}</span><i class="${type=="end"&&last==i+1?"me":""}" style="width:${Math.max(7,v/mx*100)}%">${v}</i></div>`).join("");
    h+=`<div class="btns">${type=="end"?'<button class="btn pri" id="share">Share</button>':""}<button class="btn" id="again">New game</button></div>`;
  }
  card.innerHTML=h;ov.classList.add("show");card.querySelector(".x").focus();
  const sh=$("#share");if(sh)sh.onclick=()=>{const t=`Wordle ${won?rows.length:"X"}/6\n\n`+results.map(r=>r.map(c=>({ok:"🟩",pr:"🟨",ab:"⬛"})[c]).join("")).join("\n");(navigator.clipboard?.writeText(t)||Promise.reject()).then(()=>toast("Copied to clipboard"),()=>toast("Couldn’t copy. Select and copy manually."))};
  const ag=$("#again");if(ag)ag.onclick=()=>{close();newGame()};
  card.querySelector(".x").onclick=close;
}
function close(){ov.classList.remove("show")}
ov.onclick=e=>{if(e.target==ov)close()};
addEventListener("keydown",e=>{if(e.key=="Escape")close()});
$("#help").onclick=()=>modal("help");$("#stats").onclick=()=>modal("stats");

/* ---------- game setup ---------- */
async function newGame(){
  rows=[];results=[];cur="";over=false;busy=true;answer="";token="";
  [...board.querySelectorAll(".tile")].forEach(t=>{t.className="tile";t.textContent="";t.style.animationDelay=""});
  Object.values(keys).forEach(k=>k.classList.remove("ab","pr","ok"));
  $("#sub").textContent="Choosing a word…";
  try{token=(await call("/api/new")).token;busy=false;$("#sub").textContent="Guess the five-letter word";
    if(!store.get("wl-seen",0)){store.set("wl-seen",1);setTimeout(()=>modal("help"),400)}}
  catch(e){$("#sub").textContent="Can’t reach the server, retrying…";setTimeout(newGame,3000)}
}
newGame();

/* ---------- pulsing spectrum grid (inspired by GridPulse) ---------- */
(()=>{
  const cv=$("#bg");if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const ctx=cv.getContext("2d"),CELL=28,REACH=2.6,AMB=3,MAXLIT=200,FAINT=.1,FADE=2.4;
  let W=0,H=0,cols=1,rows_=1,clear=[],frame=0,at=null,pend=0;const cells=new Map();
  const eo=t=>1-(1-t)**2,ei=t=>t*t;
  function measure(){
    W=innerWidth;H=innerHeight;cols=Math.ceil(W/CELL);rows_=Math.ceil(H/CELL);
    const d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
    clear=[...document.querySelectorAll("[data-avoid]")].map(n=>n.getBoundingClientRect());wake();
  }
  function bright(c,r){
    const x=c*CELL+CELL/2,y=r*CELL+CELL/2;let n=1e9;
    for(const b of clear){const dx=Math.max(b.left-x,0,x-b.right),dy=Math.max(b.top-y,0,y-b.bottom);n=Math.min(n,Math.hypot(dx,dy));if(!n)break}
    return n>=1e9?1:FAINT+(1-FAINT)*Math.min(1,n/(FADE*CELL));
  }
  function ink(r){
    const t=Math.min(1,r/Math.max(1,rows_-1)),hue=((60-t*270)%360+360)%360;
    const dark=root.dataset.theme=="dark",L=dark?[72,65,58,51,44]:[88,80,72,64,56];
    return `hsl(${Math.round(hue)} 94% ${L[Math.floor(Math.random()*5)]}%)`;
  }
  function draw(now){
    frame=0;ctx.clearRect(0,0,W,H);
    const lineDark=root.dataset.theme=="light";
    ctx.globalAlpha=1;ctx.strokeStyle=lineDark?"rgba(23,24,29,.07)":"rgba(241,237,228,.06)";ctx.lineWidth=1;ctx.beginPath();
    for(let x=0;x<=W;x+=CELL){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H)}for(let y=0;y<=H;y+=CELL){ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5)}ctx.stroke();
    for(const [k,c] of cells){
      let a;if(now<c.until)a=eo(Math.min(1,(now-c.born)/160));else{const t=(now-c.until)/750;if(t>=1){cells.delete(k);continue}a=1-ei(t)}
      ctx.globalAlpha=a*c.dim*(lineDark?.8:.9);ctx.fillStyle=c.colour;ctx.fillRect(c.c*CELL+1,c.r*CELL+1,CELL-1,CELL-1);
    }
    ctx.globalAlpha=1;frame=requestAnimationFrame(draw);
  }
  function wake(){if(!frame)frame=requestAnimationFrame(draw)}
  function light(c,r,hold){
    if(c<0||r<0||c>=cols||r>=rows_||cells.size>=MAXLIT)return;
    const k=c+","+r,now=performance.now(),l=cells.get(k);if(l&&now<l.until)return;
    let born=now;if(l){const f=1-ei(Math.min(1,(now-l.until)/750));born=now-(1-Math.sqrt(1-f))*160}
    cells.set(k,{c,r,colour:l?l.colour:ink(r),dim:bright(c,r),born,until:now+hold});wake();
  }
  function paint(){
    pend=0;if(!at)return;const cx=Math.floor(at.x/CELL),cy=Math.floor(at.y/CELL),s=Math.ceil(REACH);
    for(let dy=-s;dy<=s;dy++)for(let dx=-s;dx<=s;dx++){const a=Math.hypot(dx,dy);if(a>REACH||Math.random()>1-a/(REACH+.6))continue;light(cx+dx,cy+dy,260+Math.random()*900)}
  }
  addEventListener("pointermove",e=>{at={x:e.clientX,y:e.clientY};if(!pend)pend=requestAnimationFrame(paint)},{passive:true});
  (function drift(){setTimeout(drift,1400+Math.random()*1800);if(document.hidden)return;for(let i=0;i<AMB;i++)light(Math.floor(Math.random()*cols),Math.floor(Math.random()*rows_),900+Math.random()*1600)})();
  addEventListener("resize",measure);new ResizeObserver(measure).observe(board);
  document.fonts?.ready.then(measure).catch(()=>{});measure();
})();
</script>
</body>
</html>
